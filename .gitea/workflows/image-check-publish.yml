name: Docker Image CI

# No `pull_request` trigger here on purpose. This workflow pushes :latest, and
# watchtower on slug polls the registry every two minutes — a build off any PR
# branch would ship straight to ukuetis.com. PRs are covered by tests.yml, which builds and smoke-tests but never logs in
# and never pushes.
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

# No `packages: write` here: that scope is GitHub-specific and has no effect on Gitea
# Actions — the built-in GITEA_TOKEN carries no package scope at all. The registry push
# below authenticates with the REGISTRY_TOKEN PAT (an organisation-level secret on
# `projects`, inherited by this repo) instead.
permissions:
  contents: read   # checkout

# Runs are serialised so the newest commit's :latest is written last. Cancelling
# stays off: it would drop the older run's :<sha> image and leave a hole in the
# rollback tag history.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # cirunner-hatbox is shared by every repository, so a hung step holds a runner
    # slot others queue for. The readiness poll below is bounded at 30 attempts (up
    # to ~2 minutes); `docker build` and `docker exec` have no bound of their own.
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7

    - name: Compute image tags
      id: tags
      # main (this repo's default branch) -> :latest + :<sha> (watchtower deploys
      # :latest); any other branch -> :<branch>. workflow_dispatch can be fired off
      # any ref, so the else branch must never produce a tag production deploys from.
      env:
        # Passed through the environment instead of being interpolated into the
        # script text: git allows `$`, backticks, quotes and parentheses in branch
        # names, so a branch like `feat/$(id)` would otherwise execute on the runner,
        # which is self-hosted and mounts the host's docker socket.
        REF_NAME: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
      run: |
        # Gitea allows uppercase letters in repository names, docker does not
        # accept them in an image path — a repo like `Ukuetis_Site` would fail the
        # build with `invalid reference format`, so lowercase it here.
        IMAGE="gitea.vvzvlad.xyz/$(printf '%s' "$REPO" | tr 'A-Z' 'a-z')"
        if [ "$REF_NAME" = "main" ]; then
          # Tag ORDER matters and must not be "tidied up": the push step iterates
          # over $TAGS left to right, so :latest is pushed LAST and acts as the
          # commit of the whole publication. If :<sha> fails to push (network,
          # registry quota, disk), the run stops before :latest moves and prod
          # keeps running the previous image. The reverse order would publish a
          # :latest that watchtower deploys within 2 minutes while its immutable
          # :<sha> twin — the only rollback point — never made it to the registry.
          echo "tags=$IMAGE:$SHA $IMAGE:latest" >> "$GITHUB_OUTPUT"
          # The smoke gate needs ONE unambiguous tag out of the list above. The
          # :<sha> one is it — :latest is a moving target shared with whatever
          # ran before, :<sha> can only ever mean this commit's image.
          echo "smoke=$IMAGE:$SHA" >> "$GITHUB_OUTPUT"
        else
          # Sanitise the branch name into a legal docker tag
          # ([a-zA-Z0-9_][a-zA-Z0-9._-]{0,127}): illegal characters become `-`, a
          # leading non-[A-Za-z0-9_] becomes `_`, and the result is cut to 100 chars.
          branch_tag=$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9_.-' '-' | sed 's/^[^A-Za-z0-9_]/_/' | cut -c1-100)
          # The sanitiser passes a name through untouched when it already consists
          # of legal characters, so a branch literally named `latest` would come
          # out as the production tag and — one manual workflow_dispatch later —
          # ship unreviewed code to ukuetis.com. The `main` check above does not
          # cover this: the branch is not `main`, it only borrows its tag.
          # Reserved names are therefore prefixed instead of being used as-is.
          if [ "$branch_tag" = "latest" ]; then
            branch_tag="branch-latest"
          fi
          echo "tags=$IMAGE:${branch_tag}" >> "$GITHUB_OUTPUT"
          echo "smoke=$IMAGE:${branch_tag}" >> "$GITHUB_OUTPUT"
        fi

    - name: Build the Docker image
      # Step-level `timeout-minutes` is the one known to be enforced by Gitea's
      # act_runner; the job-level one above is only the outer bound. 15 minutes is
      # far above a realistic cold build here — pulling python:3.11-slim plus
      # `pip install flask loguru` takes roughly 1-4 minutes.
      timeout-minutes: 15
      env:
        # Through the environment, not interpolated into the script text: the
        # only thing standing between a branch name and command execution on the
        # runner is the `tr` filter in the step above. `$TAGS` below is
        # intentionally unquoted — the tags are a space-separated list and word
        # splitting is exactly what turns it into loop items.
        TAGS: ${{ steps.tags.outputs.tags }}
      run: |
        tag_args=""
        for tag in $TAGS; do tag_args="$tag_args --tag $tag"; done
        # --pull is required: cirunner-hatbox has a persistent docker daemon, so a
        # once-pulled python:3.11-slim would otherwise sit in its cache for months.
        # This is a BuildKit build (the default since Engine 23.0), so its cache is
        # not reclaimed by the cleanup step at the end of this job.
        docker build --pull . --file Dockerfile $tag_args

    - name: Smoke-test the built image
      # The only gate before :latest goes live (watchtower on slug picks it up
      # within two minutes). It sits between build and push, so a red smoke means
      # nothing reaches the registry.
      #
      # The container runs the image's own CMD (no `--entrypoint`, which would drop
      # CMD), so the check proves the container actually starts.
      #
      # Nothing is published to the host: checks run via `docker exec`, so parallel
      # runs on the shared daemon cannot collide on a port. The container name
      # carries the run id for the same reason.
      #
      # 5 minutes covers `docker run`, the readiness loop's ~2-minute worst case and
      # the smoke script.
      timeout-minutes: 5
      env:
        SMOKE_TAG: ${{ steps.tags.outputs.smoke }}
        NAME: ukuetis-site-smoke-${{ github.run_id }}
      run: |
        docker run -d --name "$NAME" "$SMOKE_TAG"

        # Poll instead of sleeping a guessed amount: a sleep long enough to be safe
        # is wasted on every run, and a short one turns a slow start into a flake.
        # Port 8000 is what app.py falls back to when PORT is unset, and nothing
        # here sets it.
        #
        # Ready means "the server produced an HTTP response of any kind": HTTPError
        # (4xx/5xx) counts as ready, so a 500 reaches ci/smoke.py, which reports it.
        # Connection refused or a timeout still mean not-ready.
        #
        # The program needs real newlines for try/except, so it lives in a
        # single-quoted shell variable at the block's base indentation (YAML strips
        # it, and `python -c` rejects indented code); the python uses double quotes.
        PROBE='
        import urllib.error
        import urllib.request
        try:
            urllib.request.urlopen("http://127.0.0.1:8000/", timeout=2)
        except urllib.error.HTTPError:
            pass
        '
        ready=""
        for _ in $(seq 1 30); do
          if docker exec "$NAME" python -c "$PROBE" >/dev/null 2>&1; then
            ready=1
            break
          fi
          # A container that has already exited will never become ready — report it
          # now rather than sitting out the whole timeout.
          if [ "$(docker inspect -f '{{.State.Running}}' "$NAME")" != "true" ]; then
            break
          fi
          sleep 1
        done

        if [ -z "$ready" ]; then
          echo "container produced no HTTP response at all on 127.0.0.1:8000 in 30 attempts (~35-45s when the port is refused outright, up to ~2 min when something accepts the connection and then never answers) — not even an error status (it exited, or nothing ever listened); container logs:"
          # Without this there is nothing left to diagnose from: the cleanup step
          # below removes the container.
          docker logs "$NAME"
          exit 1
        fi

        # Fed over stdin, so the image does not have to carry the test file and the
        # very same script can be run by hand against a local container.
        if ! docker exec -i "$NAME" python - < ci/smoke.py; then
          echo "smoke failed; container logs:"
          docker logs "$NAME"
          exit 1
        fi

    - name: Log in to the Gitea container registry
      # Deliberately placed here and not at the top of the job: `docker build` runs
      # arbitrary RUN instructions from the Dockerfile and the smoke step runs the
      # image's own code, both on a runner whose docker.sock is the host's. Logging
      # in only now keeps the registry credentials out of the job's docker config
      # for the whole build-and-test stretch.
      uses: docker/login-action@v4
      with:
        registry: gitea.vvzvlad.xyz
        username: ${{ github.repository_owner }}
        # PAT with the `write:package` scope, stored as an organisation secret on
        # `projects` and inherited here — do not add a repo-level secret of the same
        # name, it would shadow the org one. The built-in GITEA_TOKEN cannot be
        # used: it carries no package scope.
        password: ${{ secrets.REGISTRY_TOKEN }}

    - name: Push Docker images
      env:
        # Same reasoning as in the build step: pass the tags through the
        # environment, and leave `$TAGS` unquoted so it word-splits into items.
        TAGS: ${{ steps.tags.outputs.tags }}
      run: |
        for tag in $TAGS; do docker push "$tag"; done

    - name: Remove the smoke container from the runner
      # `always()`, and before the image cleanup below: cirunner-hatbox has one
      # persistent docker daemon shared by every repository, so a container left
      # behind by a failed run would sit there forever — and would also pin the
      # image, making the `docker rmi` in the next step fail.
      if: always()
      env:
        NAME: ukuetis-site-smoke-${{ github.run_id }}
      run: |
        docker rm -f "$NAME" || true

    - name: Remove the built images from the runner
      # The runner's docker daemon is persistent and shared with other repos, so
      # this removes ONLY the tags this run created (no `docker system prune`).
      # The BuildKit cache (the main source of disk growth) and dangling base images
      # left by `--pull` need a separate periodic cleanup on the runner host.
      # `always()` so the cleanup runs even when the smoke or the push above fails.
      if: always()
      env:
        # Same reasoning as in the build step: pass the tags through the
        # environment, and leave `$TAGS` unquoted so it word-splits into items.
        TAGS: ${{ steps.tags.outputs.tags }}
      run: |
        for tag in $TAGS; do docker rmi "$tag" || true; done
